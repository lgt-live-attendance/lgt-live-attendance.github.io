<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LGT pop-up check</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}button{font-size:18px;padding:12px 20px;margin:6px 0;border-radius:10px;border:0;background:#2563eb;color:#fff;cursor:pointer}pre{background:#f3f4f6;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head><body>
<h2>LGT pop-up check</h2>
<p>Click each button and tell Will what the grey box says.</p>
<button id="a">1. Pop-up from page</button><br>
<button id="b">2. Pop-up from background helper</button>
<pre id="log"></pre>
<script>
function log(m){document.getElementById('log').textContent+=m+"\n";}
log('Permission: '+(('Notification' in window)?Notification.permission:'not supported'));
log('Page visible: '+document.visibilityState+' | Focused: '+document.hasFocus());
log('Browser: '+navigator.userAgent);
document.getElementById('a').onclick=function(){
  try{var n=new Notification('LGT Alert 🚨',{body:'Check 1: pop-up from page',requireInteraction:true,tag:'chk-'+Date.now()});
    n.onshow=function(){log('1: SHOWN by Chrome');};
    n.onerror=function(e){log('1: ERROR event from Chrome');};
    n.onclose=function(){log('1: closed');};
    log('1: sent to Chrome');}catch(e){log('1: FAILED: '+e.name+' '+e.message);}
};
document.getElementById('b').onclick=function(){
  if(!('serviceWorker' in navigator)){log('2: no service worker support');return;}
  navigator.serviceWorker.getRegistration().then(function(r){
    if(!r){log('2: no helper registered yet');return;}
    return r.showNotification('LGT Alert 🚨',{body:'Check 2: pop-up from background helper',requireInteraction:true,tag:'chk2-'+Date.now()}).then(function(){log('2: SHOWN (Chrome accepted)');});
  }).catch(function(e){log('2: FAILED: '+e.name+' '+e.message);});
};
</script></body></html>
